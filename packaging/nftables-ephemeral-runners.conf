#
# Drop-in for nftables.service, installed as
# /etc/systemd/system/nftables.service.d/50-ephemeral-runners.conf.
# Ubuntu's nftables.service flushes the whole ruleset when it stops, and its
# /etc/nftables.conf starts with "flush ruleset" when it starts or reloads.
# Either removes every table, the runner firewall's included, so put it back
# straight after.
# --no-block: reloading another unit from inside this one's job would wait on
# itself. The "-" ignores a firewall unit that isn't running.

[Service]
ExecStartPost=-/usr/bin/systemctl reload --no-block ephemeral-runners-firewall.service
ExecReload=-/usr/bin/systemctl reload --no-block ephemeral-runners-firewall.service
ExecStopPost=-/usr/bin/systemctl reload --no-block ephemeral-runners-firewall.service
